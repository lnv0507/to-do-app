spring.application.name=Anhemsoftware-license-app
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Allow case-insensitive enums in Jackson for AI Tools input
spring.jackson.mapper.accept-case-insensitive-enums=true

spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/anhemsoftware_license_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

#mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


spring.output.ansi.enabled=always

# Multipart file upload limit
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:10MB}

# AWS S3 Configuration
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-southeast-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME}

# Docker Compose
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

#openai
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.reasoning-effort=hight
spring.ai.openai.model=${OPENAI_MODEL:gpt-5-nano}
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

spring.ai.chat.memory.repository.jdbc.platform=mysql
spring.ai.chat.memory.repository.jdbc.schema=classpath:schema-mysql.sql
spring.ai.openai.temperature=${OPENAI_TEMPERATURE:0.4}
spring.ai.openai.max-tokens=${OPENAI_MAX_TOKENS:2000}

#actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.web.socket.config.WebSocketMessageBrokerStats=WARN

# Virtual Threads
spring.threads.virtual.enabled=true

# Auth Cache and TTL Configurations
auth.redis.prefix.refresh=REFRESH:
auth.redis.prefix.user-sessions=USER_SESSIONS:
auth.redis.prefix.action-token=ACTION_TOKEN:
auth.redis.prefix.pending-login=PENDING_LOGIN:

auth.ttl.refresh-days=7
auth.ttl.device-cookie-days=1825
auth.ttl.action-token-hours=24
auth.ttl.pending-login-minutes=10
